<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fathur Shop</title>

    <!-- File CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SELAMAT DATANG DI MINIMARKET</h1>

        <!-- Daftar Produk -->
        <div id="products-list">

            <h2>DAFTAR PRODUK</h2>

            <!-- Tempat produk tampil -->
            <div id="products" class="product-container"></div>

        </div>

        <!-- Keranjang -->
        <div id="cart">

            <h2>KERANJANG BELANJA</h2>

            <ul id="cart-items"></ul>

            <p>
                Total: Rp 
                <span id="total-price">0</span>
            </p>

            <button id="checkout-btn">
                Checkout
            </button>

        </div>

    </div>

    <!-- File JavaScript -->
    <script src="script.js"></script>

</body>
</html>
